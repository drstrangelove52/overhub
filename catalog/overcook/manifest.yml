# Over-App-Vertrag, Manifest-Format schema 1 (siehe second-brain
# "04 Ressourcen/Over-App-Vertrag"). compose.yml ist eine Kopie von
# compose.overhub.yml aus dem (privaten) Repo drstrangelove52/overcook.
schema: 1
id: overcook
name: OverCook
description: Rezepte sammeln und skalieren, Einkaufsliste offline auf dem Handy
version: 0.1.3
min_overhub: 0.1.0
port: 8443
arch: [amd64, arm64]
min_ram_mb: 1024
pwa: true
icon: icon.png

images:
  ghcr.io/drstrangelove52/overcook-backend: sha256:c95f357b1f085752a9b04f563d90100e2b294b24581ae8b86ed2dfff23c17178
  ghcr.io/drstrangelove52/overcook-frontend: sha256:caee102ed79f17591fc0eb122641b0d590647470f8c12f1ad8a926bda7246f6b
  ghcr.io/drstrangelove52/overcook-mcp: sha256:182b6eb9a5090c9611958c9b0fc7f2170f9acd1ef3b222242d80a3ec4a5eca12

env:
  generated:
    - { name: MYSQL_ROOT_PASSWORD, generate: password }
    - { name: MYSQL_PASSWORD, generate: password }
    - { name: SESSION_SECRET, generate: token }
    - { name: ADMIN_PASSWORD, generate: password, show_once: true }
  fixed:
    MYSQL_DATABASE: overcook
    MYSQL_USER: overcook
    SESSION_COOKIE_NAME: overcook_session
    SESSION_COOKIE_SECURE: "true"
  settings:
    - name: ADMIN_USERNAME
      label: Benutzername des ersten Admins
      default: admin
      only_at_install: true

components:
  mcp:
    label: MCP-Server für Claude
    description: Erlaubt Claude, Rezepte anzulegen und zu suchen (unter /mcp)
    default: false
    env:
      generated:
        - { name: MCP_API_KEY, generate: token, show_once: true }
        - { name: MCP_SERVICE_PASSWORD, generate: password }
      fixed:
        MCP_SERVICE_USERNAME: mcp-agent

admin:
  mode: env

health: /api/health
version_endpoint: /api/version

backup:
  dump:
    service: db
    # --add-drop-database: a restore (e.g. rollback after a failed update) must
    # also remove tables a newer version's migration created.
    command: sh -c 'exec mariadb-dump -uroot -p"$MYSQL_ROOT_PASSWORD" --single-transaction --routines --add-drop-database --databases "$MYSQL_DATABASE"'
  restore:
    service: db
    command: sh -c 'exec mariadb -uroot -p"$MYSQL_ROOT_PASSWORD"'
  volumes: [images_data]
